name: Build and Deploy MCPier to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-0aed2ee099a5e5289
  PUBLIC_URL: http://65.1.226.49

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build diagnostics - backend dependency resolution
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m pip install -e . --no-deps || true
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print('Backend project OK:', d['project']['name'])"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build diagnostics - frontend install and build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV

      - name: Compute image URI
        id: image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_TAG="${GITHUB_SHA::8}"
          echo "uri=$FULL_IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image URI: $FULL_IMAGE:$IMAGE_TAG"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            CORS_ORIGINS=http://65.1.226.49

      - name: Deploy via SSM to EC2
        run: |
          REGION="$AWS_REGION"
          INSTANCE="$INSTANCE_ID"
          ECR_REGISTRY_V="$ECR_REGISTRY"
          ECR_REPOSITORY_V="$ECR_REPOSITORY"
          IMAGE_URI="$ECR_REGISTRY_V/$ECR_REPOSITORY_V:latest"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY_V",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e DATABASE_URL='$DATABASE_URL' -e SECRET_KEY='$SECRET_KEY' -e CORS_ORIGINS='http://65.1.226.49' $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed --instance-id "$INSTANCE" --command-id "$COMMAND_ID" --region "$REGION" || true
          aws ssm get-command-invocation --instance-id "$INSTANCE" --command-id "$COMMAND_ID" --region "$REGION" --query "Status" --output text

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            echo "Attempt $i: checking $PUBLIC_URL/api/health"
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$PUBLIC_URL/api/health" || echo "000")
            echo "HTTP status: $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Deployment verified healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1