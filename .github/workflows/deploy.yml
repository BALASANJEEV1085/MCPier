name: Build and Deploy MCPier to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-0aed2ee099a5e5289
  SECRETS_ID: deptic/MCPier/secrets
  HEALTH_URL: http://65.1.226.49/api/health

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install backend deps and sanity check
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[standard]" || pip install .
          python -c "from src.main import app; print('FastAPI app import OK:', app.title)"

      - name: Ensure Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
          cat > Dockerfile << 'EOF'
          FROM node:20-alpine AS frontend
          WORKDIR /app/frontend
          COPY frontend/package.json frontend/package-lock.json* ./
          RUN npm install
          COPY frontend/ ./
          RUN npm run build

          FROM python:3.11-slim
          WORKDIR /app/backend
          COPY backend/pyproject.toml ./
          COPY backend/src ./src
          COPY backend/README.md ./
          RUN pip install --no-cache-dir "."
          COPY --from=frontend /app/frontend /app/frontend
          ENV PORT=80
          EXPOSE 80
          CMD ["sh", "-c", "uvicorn src.main:app --host 0.0.0.0 --port 80"]
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS credentials configured via environment"

      - name: Login to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${{ github.sha }}" .
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          echo "IMAGE_URI=$FULL_IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Deploy to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=\$(aws secretsmanager get-secret-value --secret-id $SECRETS_ID --region $AWS_REGION --query SecretString --output text)",
              "export DATABASE_URL=\$(echo \$SECRET_JSON | jq -r '.DATABASE_URL')",
              "export SECRET_KEY=\$(echo \$SECRET_JSON | jq -r '.SECRET_KEY')",
              "export CORS_ORIGINS=\$(echo \$SECRET_JSON | jq -r '.CORS_ORIGINS')",
              "docker run -d --restart always -p 80:80 --name app -e DATABASE_URL=\$DATABASE_URL -e SECRET_KEY=\$SECRET_KEY -e CORS_ORIGINS=\$CORS_ORIGINS $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION" || true
          aws ssm get-command-invocation --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "{Status:Status,Output:Output,Error:StandardErrorContent}" --output text

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 20 attempts."
          exit 1