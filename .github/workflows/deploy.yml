name: Deploy MCPier Backend to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-0aed2ee099a5e5289
  SECRET_ID: deptic/MCPier/secrets
  PUBLIC_URL: http://65.1.226.49

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[standard]" || pip install .

      - name: Verify backend imports
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
          SECRET_KEY: ci-secret-key
          CORS_ORIGINS: http://localhost:3000
        run: |
          cd ..
          python - <<'EOF'
          import sys
          sys.path.insert(0, "backend")
          from src.main import app
          print("FastAPI app loaded:", app.title)
          EOF

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:${{ github.sha }}" -t "$FULL_IMAGE:latest" .
          docker image inspect "$FULL_IMAGE:${{ github.sha }}" > /dev/null && echo "Image built OK"

      - name: Push image to ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          REGION="$AWS_REGION"
          ECR_REGISTRY="$ECR_REGISTRY"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "aws secretsmanager get-secret-value --secret-id $SECRET_ID --region $REGION --query SecretString --output text > /tmp/mcpier-secrets.json",
              "export DATABASE_URL=\$(python3 -c \"import json;print(json.load(open('/tmp/mcpier-secrets.json')).get('DATABASE_URL',''))\")",
              "export SECRET_KEY=\$(python3 -c \"import json;print(json.load(open('/tmp/mcpier-secrets.json')).get('SECRET_KEY',''))\")",
              "export CORS_ORIGINS=\$(python3 -c \"import json;print(json.load(open('/tmp/mcpier-secrets.json')).get('CORS_ORIGINS',''))\")",
              "docker run -d --restart always -p 80:80 --name app -e DATABASE_URL=\$DATABASE_URL -e SECRET_KEY=\$SECRET_KEY -e CORS_ORIGINS=\$CORS_ORIGINS $IMAGE_URI",
              "rm -f /tmp/mcpier-secrets.json",
              "sleep 10",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION"
          aws ssm get-command-invocation --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "{Status:Status,Output:Output,Error:StandardErrorContent}" --output text

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/api/health" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              curl -s "$PUBLIC_URL/api/health"
              echo "Deployment verified healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1