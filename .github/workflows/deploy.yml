name: Build and Deploy MCPier to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-02ada14feb47b555c
  CONTAINER_PORT: 80

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build backend diagnostics
        run: |
          cd backend
          pip install -e .
          python -c "from src.main import app; print('Backend app loaded successfully')"

      - name: Build frontend diagnostics
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Docker image to ECR
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          docker build -t "$FULL_IMAGE" -f Dockerfile .
          # Use direct AWS CLI to login
          aws ecr get-login-password --region "${{ env.REGION }}" | docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"
          docker push "$FULL_IMAGE"
          echo "IMAGE_URI=$FULL_IMAGE" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy via SSM on EC2
        run: |
          # Write SSM parameters to file to avoid shell escaping issues
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          # Substitute variables in the JSON (not shell-expanded inside the heredoc)
          sed -i "s|\$REGION|${{ env.REGION }}|g; s|\$ECR_REGISTRY|${{ env.ECR_REGISTRY }}|g; s|\$IMAGE_URI|${{ env.IMAGE_URI }}|g" /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region "${{ env.REGION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command ID: $COMMAND_ID"
          # Wait for command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --region "${{ env.REGION }}" \
              --query "CommandInvocations[0].Status" \
              --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed with status: $STATUS"
              # Get error output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ env.INSTANCE_ID }}" \
                --region "${{ env.REGION }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 15
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://3.6.254.170/ || true)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed: received HTTP status $HTTP_STATUS"
            curl -v http://3.6.254.170/ || true
            exit 1
          fi
          echo "Health check passed: HTTP 200 OK"
          echo "Application is reachable at: http://3.6.254.170"