name: Deploy MCPier Backend to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-0aed2ee099a5e5289
  PUBLIC_URL: http://65.1.226.49
  SECRETS_MANAGER_ID: deptic/MCPier/secrets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static env)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS creds present: $([ -n \"$AWS_ACCESS_KEY_ID\" ] && echo yes || echo no)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Dockerfile (backend context)
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim
          WORKDIR /app
          COPY backend/pyproject.toml backend/README.md ./
          COPY backend/src ./src
          RUN pip install --no-cache-dir .
          EXPOSE 8300
          CMD ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8300"]
          EOF
          cat Dockerfile

      - name: Build image
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:latest" -t "$IMAGE_URI:${{ github.sha }}" .
          docker images | head -5

      - name: Push to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:${{ github.sha }}"

      - name: Fetch runtime secrets and deploy via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" \
            --query SecretString --output text)
          DATABASE_URL=$(echo "$SECRET_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('DATABASE_URL',''))")
          SECRET_KEY=$(echo "$SECRET_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('SECRET_KEY',''))")
          if [ -z "$DATABASE_URL" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error::Missing DATABASE_URL or SECRET_KEY in Secrets Manager"; exit 1
          fi
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8300 -e DATABASE_URL='$DATABASE_URL' -e SECRET_KEY='$SECRET_KEY' -e PORT=8300 $IMAGE_URI:latest",
              "sleep 5",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text)
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && { aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Output --output text; exit 1; }
            sleep 5
          done
          [ "$STATUS" = "Success" ] || exit 1
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Output --output text

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$PUBLIC_URL/api/health" || echo 000)
            echo "Attempt $i: HTTP $CODE"
            cat /tmp/health.json 2>/dev/null || true
            [ "$CODE" = "200" ] && { echo "Health check passed"; exit 0; }
            sleep 10
          done
          echo "::error::Health check failed after 20 attempts"
          exit 1