name: Build, Deploy & Verify MCPier Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-02ada14feb47b555c
  CONTAINER_PORT: 80
  HEALTH_URL: http://3.6.254.170

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install backend dependencies (diagnostic)
        run: |
          cd backend
          pip install hatchling
          pip install -e .
          python -c "from src.main import app; print('Backend imports OK')"

      - name: Install frontend dependencies (diagnostic)
        run: |
          cd frontend
          npm ci
          npm run build 2>&1 | tail -5
          echo "Frontend build diagnostics complete"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push Docker image
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Build and push
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --tag "$FULL_IMAGE" \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" \
            --push \
            .
          echo "IMAGE_URI=$FULL_IMAGE" >> $GITHUB_ENV

      - name: Build image tag for deployment
        run: |
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSM
        env:
          REGION: ${{ env.AWS_DEFAULT_REGION }}
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          REGION="$REGION"
          INSTANCE_ID="$INSTANCE_ID"
          ECR_REGISTRY="$ECR_REGISTRY"
          IMAGE_URI="$IMAGE_URI"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to finish
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Command status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment command succeeded"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment command failed with status: $STATUS"
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text
              exit 1
            fi
            sleep 10
          done

      - name: Health check
        run: |
          echo "Waiting for application to become healthy..."
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.HEALTH_URL }}/api/health" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              curl -s "${{ env.HEALTH_URL }}/api/health"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 20 attempts"
          exit 1