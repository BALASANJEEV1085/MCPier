---
name: Deploy MCPier to EC2 (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-02ada14feb47b555c
  PUBLIC_URL: http://3.6.254.170
  CONTAINER_PORT: 80
  SECRETS_MANAGER_ID: deptic/MCPier/secrets

jobs:
  build-and-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          echo "FULL_IMAGE=$IMAGE_URI" >> "$GITHUB_ENV"
          docker build -t "$IMAGE_URI" -f Dockerfile .

      - name: Run build diagnostics
        run: |
          docker inspect "$FULL_IMAGE" --format='{{.Size}}' | xargs -I{} echo "Image size: {} bytes"
          docker run --rm "$FULL_IMAGE" python -c "from src.main import app; print('Import OK')" || \
            docker run --rm "$FULL_IMAGE" sh -c "python -c 'print(\"Python OK\")'"

      - name: Install AWS CLI
        run: |
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install --update

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'AWS_CREDS'
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_CREDS
          cat > ~/.aws/config << 'AWS_CONF'
          [default]
          region = ${{ env.AWS_REGION }}
          output = json
          AWS_CONF

      - name: Push Docker image to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE"

      - name: Retrieve secrets and write .env on EC2
        run: |
          SECRETS_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" \
            --query SecretString --output text)

          # Build .env file content from secrets
          cat > /tmp/dotenv.txt << 'DOSEP'
          DATABASE_URL=$(echo "$SECRETS_JSON" | jq -r '.DATABASE_URL // ""')
          SECRET_KEY=$(echo "$SECRETS_JSON" | jq -r '.SECRET_KEY // ""')
          CORS_ORIGINS=$(echo "$SECRETS_JSON" | jq -r '.CORS_ORIGINS // ""')
          DOSEP

          # Build SSM file to copy .env to EC2 then run container
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "apt-get update -qq && apt-get install -y -qq jq >/dev/null 2>&1",
              "mkdir -p /home/ubuntu/app",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI"
            ]
          }
          SSMPARAMS

          # Write .env then deploy
          cat > /tmp/ssm-put-env.json << 'SSMENV'
          {
            "commands": [
              "aws ssm get-parameter --name \"/deptic/MCPier/secrets\" --with-decryption --region $REGION --query Parameter.Value --output text | python3 -c \"import sys,json; d=json.load(sys.stdin); [print(f'{k}={v}') for k,v in d.items()]\" > /home/ubuntu/app/.env"            ]
          }
          SSMENV

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-put-env.json \
            --query "Command.CommandId" --output text)
          echo "SECRETS_CMD_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION"

      - name: Deploy container on EC2 via SSM
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /home/ubuntu/app/.env $FULL_IMAGE"
            ]
          }
          SSMPARAMS
          sed -i "s|\$FULL_IMAGE|${FULL_IMAGE}|g; s|\$REGION|${AWS_REGION}|g; s|\$ECR_REGISTRY|${ECR_REGISTRY}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "DEPLOY_CMD_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION"

      - name: Health check
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PUBLIC_URL/api/health" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed — HTTP $HTTP_CODE"
            curl -v --max-time 10 "$PUBLIC_URL/api/health" 2>&1 | tail -20
            exit 1
          fi
          echo "Health check OK — HTTP 200"
          curl -s "$PUBLIC_URL/api/health" | python3 -m json.tool