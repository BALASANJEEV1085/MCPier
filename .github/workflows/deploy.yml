name: Build and Deploy to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-0aed2ee099a5e5289
  PUBLIC_URL: http://65.1.226.49
  SECRETS_MANAGER_ID: deptic/MCPier/secrets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Set up Python (verify backend imports)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify backend dependencies resolve
        run: |
          python -m pip install --upgrade pip
          pip install ./backend
          python -c "import fastapi, sqlalchemy, asyncpg; print('backend deps OK')"

      - name: Generate production Dockerfile (backend FastAPI on port 80)
        run: |
          cat > Dockerfile << 'DOCKERFILE'
          FROM python:3.11-slim
          WORKDIR /app
          COPY backend/pyproject.toml ./
          COPY backend/src ./src
          RUN pip install --no-cache-dir .
          ENV PORT=80
          EXPOSE 80
          CMD ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "80"]
          DOCKERFILE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static env)
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "$AWS_REGION"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_TAG="$FULL_IMAGE:${GITHUB_SHA::8}"
          LATEST_TAG="$FULL_IMAGE:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          echo "IMAGE_URI=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Fetch runtime secrets from AWS Secrets Manager
        run: |
          SECRETS_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" \
            --query SecretString --output text)
          DATABASE_URL=$(echo "$SECRETS_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('DATABASE_URL',''))")
          SECRET_KEY=$(echo "$SECRETS_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('SECRET_KEY',''))")
          CORS_ORIGINS=$(echo "$SECRETS_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('CORS_ORIGINS',''))")
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "CORS_ORIGINS=$CORS_ORIGINS" >> "$GITHUB_ENV"

      - name: Deploy to EC2 via SSM (stop old, run new on port 80)
        run: |
          IMAGE_URI="$IMAGE_URI"
          REGION="$AWS_REGION"
          ECR_REGISTRY="$ECR_REGISTRY"
          INSTANCE_ID="$INSTANCE_ID"
          DATABASE_URL_ENV="$DATABASE_URL"
          SECRET_KEY_ENV="$SECRET_KEY"
          CORS_ORIGINS_ENV="$CORS_ORIGINS"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e DATABASE_URL='$DATABASE_URL_ENV' -e SECRET_KEY='$SECRET_KEY_ENV' -e CORS_ORIGINS='$CORS_ORIGINS_ENV' $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query Status --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "{Output:StandardOutputContent,Error:StandardErrorContent}" --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

      - name: Print deployment diagnostics
        run: |
          echo "Image: $IMAGE_URI"
          echo "Instance: $INSTANCE_ID"
          echo "Region: $AWS_REGION"
          echo "Public URL: $PUBLIC_URL"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "docker ps --format '{{.Names}} {{.Image}} {{.Status}} {{.Ports}}'",
              "docker logs --tail 50 app || true"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          sleep 15
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text || true

      - name: Health check (must return HTTP 200)
        run: |
          HEALTH_URL="$PUBLIC_URL/api/health"
          echo "Checking $HEALTH_URL"
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 20 attempts."
          exit 1