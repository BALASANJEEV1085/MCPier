name: Deploy MCPier to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-0aed2ee099a5e5289
  PUBLIC_URL: http://65.1.226.49

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (backend sanity)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (frontend sanity)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required files exist
        run: |
          set -e
          test -f backend/pyproject.toml || { echo "missing backend/pyproject.toml"; exit 1; }
          test -f frontend/package.json || { echo "missing frontend/package.json"; exit 1; }
          test -f Dockerfile || { echo "missing Dockerfile at repo root (dockerfile_path=.)"; exit 1; }
          echo "Dockerfile present:"
          head -50 Dockerfile

      - name: Configure AWS credentials via env
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to ECR and build/push image
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${{ github.sha }}" .
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          docker images | grep "$ECR_REPOSITORY"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGION="$AWS_REGION"
          ECR_REGISTRY="$ECR_REGISTRY"
          ECR_REPOSITORY="$ECR_REPOSITORY"
          IMAGE_URI="$IMAGE_URI"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM CommandId: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query Status --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "{Output:StandardOutputContent,Error:StandardErrorContent}"
              exit 1
            fi
            sleep 10
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command did not succeed"; exit 1; }

      - name: Health check
        run: |
          set -e
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$PUBLIC_URL/api/health" || echo "000")
            echo "Attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Deployment verified healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed at $PUBLIC_URL/api/health"
          exit 1

      - name: Notify failure
        if: failure()
        run: echo "Deploy of $ECR_REGISTRY/$ECR_REPOSITORY to instance $INSTANCE_ID failed."