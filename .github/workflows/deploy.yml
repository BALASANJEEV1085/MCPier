name: Build and Deploy to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: mcpier
  INSTANCE_ID: i-0aed2ee099a5e5289
  CONTAINER_PORT: "80"
  HEALTH_URL: http://65.1.226.49/api/health

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies and verify import
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "from src.main import app; print('Backend app import OK')"

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "$AWS_REGION"
        env:
          AWS_REGION: ap-south-1

      - name: Build Docker image
        run: |
          FULL_IMAGE="759204735992.dkr.ecr.ap-south-1.amazonaws.com/mcpier"
          docker build -t "$FULL_IMAGE:${{ github.sha }}" -t "$FULL_IMAGE:latest" .
          docker images | head -5

      - name: Push image to ECR
        run: |
          REGION="ap-south-1"
          REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE_URI="$REGISTRY/mcpier"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      - name: Deploy to EC2 via SSM
        run: |
          REGION="ap-south-1"
          REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE_URI="$REGISTRY/mcpier:${{ github.sha }}"
          INSTANCE_ID="i-0aed2ee099a5e5289"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mcpier:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mcpier:latest"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output text

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            echo "Attempt $i: checking $HEALTH_URL"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            echo "HTTP status: $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment verified: health check returned 200"
              curl -s "$HEALTH_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 20 attempts"
          exit 1